name: "Setup"
description: "Install the toolchain described in flake.nix, plus project dependencies"

inputs:
  browsers:
    description: "Hand Playwright the nixpkgs Firefox (only the Firefox test job needs it)"
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: DeterminateSystems/nix-installer-action@v22

    # 道具の一覧はflake.nixの`toolchain`が持つ。ここで名前を並べ直すと、
    # devShellに足したのにCIで落ちる(あるいはその逆)という食い違いが起きる
    - name: Install the toolchain
      shell: bash
      run: nix profile install .#toolchain

    # playwrightのダウンローダは使わない。落ちてくるビルドは共有ライブラリを
    # FHSの場所から探すため、nixで組んだ環境では動かない。参照するのは
    # devShellと同じ導出なので、手元とCIで同じFirefoxになる
    - name: Take the browsers from nixpkgs
      if: inputs.browsers == 'true'
      shell: bash
      run: |
        browsers=$(nix build .#playwright-browsers --no-link --print-out-paths)
        echo "PLAYWRIGHT_BROWSERS_PATH=$browsers" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

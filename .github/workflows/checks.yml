name: Checks

# PRでもリリースでも同じ検査を通す。ここ一つに書いて両方から呼ぶ。
# 片方にだけ足すと、通したつもりの検査がもう片方をすり抜ける
on:
  workflow_call:

# 直列に並べると、いちばん遅い1つ(Firefoxのテスト)の後ろに他が全部つながる。
# 独立したジョブに分ければ待ち時間はいちばん遅いジョブの分だけになる
jobs:
  static:
    name: Format / Lint / Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      # 使われていないexport・ファイル・依存。oxlintは1ファイルしか見ないので拾えない
      - run: pnpm run knip

  test-logic:
    name: Test (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:logic

  test-dom:
    name: Test (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - run: pnpm run test:dom

      # 落ちた画面だけが残る。緑のときは何も上がらない
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: firefox-failure-screenshots
          path: |
            src/**/__screenshots__/
            .vitest-attachments/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build
